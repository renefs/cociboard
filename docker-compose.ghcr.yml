# Cociboard from the prebuilt image on the GitHub Container Registry: nothing is built
# on the host. Copy this file as `docker-compose.yml` into an empty folder (optionally
# with a `.env`, see `.env.example`). The image is private: run `docker login ghcr.io`
# first. See "Deployment (prebuilt image)" in README.md.
services:
  cociboard:
    image: ghcr.io/renefs/cociboard:${COCIBOARD_TAG:-latest}
    container_name: cociboard
    restart: unless-stopped
    ports:
      - "${COCIBOARD_PORT:-8000}:8000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      COCIBOARD_SEED_ON_STARTUP: ${COCIBOARD_SEED_ON_STARTUP:-true}
      COCIBOARD_PASSWORD: ${COCIBOARD_PASSWORD:-}
      COCIBOARD_PASSWORD_HASH: ${COCIBOARD_PASSWORD_HASH:-}
      COCIBOARD_SECRET_KEY: ${COCIBOARD_SECRET_KEY:-}
      COCIBOARD_SESSION_DAYS: ${COCIBOARD_SESSION_DAYS:-90}
      COCIBOARD_BACKUP_INTERVAL_HOURS: ${COCIBOARD_BACKUP_INTERVAL_HOURS:-}
      COCIBOARD_BACKUPS_KEPT: ${COCIBOARD_BACKUPS_KEPT:-}
      COCIBOARD_BACKUP_DIR: ${COCIBOARD_BACKUP_DIR:-}
      COCIBOARD_RECIPE_IMPORT: ${COCIBOARD_RECIPE_IMPORT:-}
    volumes:
      - ./data:/data
