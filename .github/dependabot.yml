# Weekly dependency updates. Minor and patch updates arrive grouped in one PR per ecosystem;
# every major update is its own PR, so one breaking change never blocks the safe ones.
# CI builds and smoke tests the image on each PR (ADR-0021).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Packages that must move together arrive in one PR, majors included: a React major
      # split across react and react-dom PRs fails npm's peer check in each of them.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      i18next:
        patterns: ["i18next", "react-i18next"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; lift this when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The image's Python must match backend/.python-version (uv sync --frozen uses it) and
      # requires-python in backend/pyproject.toml; move all three together, by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node majors are bumped by hand, following the LTS line.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /userguide
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      userguide:
        patterns: ["*"]
