# Builds the production image for amd64 and arm64 and pushes it to the GitHub Container
# Registry (ghcr.io/<owner>/cociboard). The package inherits the repository's visibility,
# so it stays private while the repository is private (ADR-0011). The image is only pushed
# after ci.yml passes: `make check`, the Playwright end-to-end tests (ADR-0028) and a container
# smoke test of the amd64 image (ADR-0021).
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # A release tag must match the VERSION file, so the image reports the right version.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(cat VERSION)"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match VERSION (expected $expected)" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.8.0 → 0.8.0, 0.8 and latest; main → main; every build → sha-<short>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
