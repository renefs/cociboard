# Builds the production image for amd64 and arm64 and pushes it to the GitHub Container
# Registry (ghcr.io/<owner>/cociboard). The package inherits the repository's visibility,
# so it stays private while the repository is private (ADR-0011). The image is only pushed
# after `make check` passes (ci.yml) and a container smoke test succeeds (ADR-0021).
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A release tag must match the VERSION file, so the image reports the right version.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(cat VERSION)"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match VERSION (expected $expected)" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build the amd64 image once, load it locally and start it. The later multi-arch
      # build reuses the same gha cache, so this costs little extra.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cociboard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          expected="$(cat VERSION)"
          docker volume create cociboard-smoke-data
          docker run -d --name cociboard-smoke -p 8000:8000 \
            -v cociboard-smoke-data:/data cociboard:smoke
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health -o health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "The container did not become healthy in time" >&2
            docker logs cociboard-smoke
            exit 1
          fi
          cat health.json
          if ! grep -q "\"version\": *\"$expected\"" health.json; then
            echo "/api/health does not report version $expected" >&2
            docker logs cociboard-smoke
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)"
          if [ "$code" != "200" ]; then
            echo "GET / returned $code, expected 200" >&2
            docker logs cociboard-smoke
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs cociboard-smoke || true

      - name: Clean up the smoke test
        if: always()
        run: |
          docker rm -f cociboard-smoke || true
          docker volume rm cociboard-smoke-data || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.8.0 → 0.8.0, 0.8 and latest; main → main; every build → sha-<short>.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
