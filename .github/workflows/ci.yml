# Runs `make check` (version consistency, lint, type checks, tests) and builds the amd64
# image and smoke tests it (scripts/smoke-test.sh). Used on its own for pull requests and
# branch pushes, and called by docker-publish.yml before an image is published (ADR-0021). main and tags are not listed under `push` because the publish
# workflow already runs this one for them.
name: CI

on:
  pull_request:
  push:
    # Dependabot branches already run through pull_request; running on push too would
    # build the image twice.
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version-file: backend/.python-version
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: make check
        run: make check

  # Builds the production image and starts it, so a change that breaks the Dockerfile or the
  # running app (a base image bump, say) fails on the pull request. The gha cache is shared
  # with docker-publish.yml (same default scope), so the publish build reuses the layers.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cociboard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: scripts/smoke-test.sh cociboard:smoke
