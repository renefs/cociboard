# Runs `make check` (version consistency, lint, type checks, tests). Used on its own for
# pull requests and branch pushes, and called by docker-publish.yml before an image is
# published (ADR-0021). main and tags are not listed under `push` because the publish
# workflow already runs this one for them.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version-file: backend/.python-version
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: make check
        run: make check
